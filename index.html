<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armenia Cadastre over OpenStreetMap</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CjxyZWN0IHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgcng9IjE0IiBmaWxsPSIjMGYxNzJhIi8+CjxwYXRoIGQ9Ik0zMiAxMmMtOCAwLTE0IDYtMTQgMTQgMCAxMCAxNCAyNiAxNCAyNnMxNC0xNiAxNC0yNmMwLTgtNi0xNC0xNC0xNHoiIGZpbGw9IiMzOGJkZjgiLz4KPGNpcmNsZSBjeD0iMzIiIGN5PSIyNiIgcj0iNiIgZmlsbD0iIzBmMTcyYSIvPgo8L3N2Zz4=">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#0f172a; --panel:#111827; --line:#1f2937; --txt:#e5e7eb; --mut:#9ca3af; --acc:#38bdf8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:system-ui,Segoe UI,Roboto,sans-serif; }
  #map { position:absolute; inset:0; }
  .panel {
    position:absolute; top:12px; left:12px; z-index:1000; width:300px; max-height:calc(100% - 24px);
    overflow:auto; background:rgba(17,24,39,.94); color:var(--txt); border:1px solid var(--line);
    border-radius:12px; padding:14px; backdrop-filter:blur(6px); font-size:13px;
  }
  .panel h1 { font-size:14px; margin:0 0 2px; }
  .panel .sub { color:var(--mut); font-size:11px; margin:0 0 12px; }
  .row { display:flex; gap:6px; margin-bottom:10px; }
  textarea { width:100%; resize:vertical; padding:8px; border-radius:8px; border:1px solid var(--line);
    background:#0b1220; color:var(--txt); font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
  .row button { padding:8px 10px; border:0; border-radius:8px; background:var(--acc); color:#04283a;
    font-weight:600; cursor:pointer; }
  fieldset { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:0 0 10px; }
  legend { color:var(--mut); font-size:11px; padding:0 4px; text-transform:uppercase; letter-spacing:.04em; }
  label.chk { display:flex; align-items:center; gap:8px; padding:3px 0; cursor:pointer; }
  select, input[type=range] { width:100%; }
  .hint { color:var(--mut); font-size:11px; line-height:1.4; }
  .status { font-size:11px; color:var(--acc); min-height:14px; margin-top:4px; }
  #legend { margin-top:8px; }
  .legrow { display:flex; align-items:center; gap:8px; padding:2px 0; font-size:12px; }
  .swatch { width:12px; height:12px; border-radius:3px; flex:none; border:1px solid rgba(255,255,255,.35); cursor:pointer; }
  .legrow .code { font-family:ui-monospace,Menlo,Consolas,monospace; }
  .legrow .area { color:var(--mut); font-size:11px; margin-left:auto; }
  .legrow .miss { color:#f87171; font-size:11px; }
  .mlabel { background:rgba(15,23,42,.8); color:#fff; border:1px solid rgba(255,255,255,.3);
    border-radius:5px; padding:1px 5px; font:600 11px system-ui; white-space:nowrap; }
  .llabel { background:rgba(2,6,23,.72); color:#e2e8f0; border-radius:4px; padding:0 3px;
    font:11px ui-monospace,monospace; white-space:nowrap; }
  .leaflet-popup-content { font-size:12px; }
  .leaflet-popup-content table { border-collapse:collapse; }
  .leaflet-popup-content td { padding:2px 6px; border-bottom:1px solid #eee; vertical-align:top; }
  .leaflet-popup-content td:first-child { color:#555; font-weight:600; }
  a { color:var(--acc); }
  .locate-btn { color:#111; font-size:18px; text-align:center; }
  .locate-btn.active { color:#2563eb; }
  .panel-toggle { position:absolute; top:8px; right:8px; z-index:2; width:32px; height:32px;
    border:1px solid var(--line); border-radius:8px; background:#1f2937; color:var(--txt);
    font-size:16px; line-height:1; cursor:pointer; }
  .panel h1 { padding-right:30px; }
  .panel.collapsed { width:auto; max-height:none; padding:8px; overflow:visible; }
  .panel.collapsed #panelBody { display:none; }
  .panel.collapsed .panel-toggle { position:static; }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel" id="panel">
  <button id="panelToggle" class="panel-toggle" data-i18n-title="panelToggle" title="Show/hide panel">☰</button>
  <div id="panelBody">
  <div class="row" style="justify-content:flex-end;margin-bottom:6px">
    <select id="lang" style="width:auto">
      <option value="hy">ՀՅ</option>
      <option value="en">EN</option>
      <option value="ru">РУ</option>
    </select>
  </div>
  <h1 data-i18n="title">Armenia Cadastre × OpenStreetMap</h1>
  <p class="sub" data-i18n="sub">Official e-cadastre GeoServer layers overlaid on OSM.</p>

  <textarea id="codes" rows="7" data-i18n-ph="codesPh" placeholder="One code per line, e.g.
01-001-0658-0020
01-001-0658-0017
01-001-0658-0021"></textarea>
  <div class="row" style="margin-top:8px">
    <button id="find" style="flex:1" data-i18n="plot">Plot all</button>
    <button id="share" style="background:#10b981;color:#04283a" data-i18n="share">Share</button>
    <button id="clear" style="background:#374151;color:#e5e7eb" data-i18n="clear">Clear</button>
  </div>
  <div id="status" class="status"></div>
  <div id="legend"></div>

  <fieldset>
    <legend data-i18n="legBasemap">Basemap</legend>
    <select id="basemap">
      <option value="osm">OpenStreetMap</option>
      <option value="carto">Carto Light</option>
      <option value="esri">Esri Satellite</option>
      <option value="cartoDark">Carto Dark</option>
      <option value="topo">OpenTopoMap</option>
      <option value="esriTopo">Esri Topographic</option>
      <option value="esriStreet">Esri Streets</option>
      <option value="cyclosm">CyclOSM</option>
      <option value="hot">Humanitarian OSM</option>
      <option value="ortho">e-cadastre Orthophoto 2002</option>
    </select>
  </fieldset>

  <fieldset>
    <legend data-i18n="legRasters">Cadastre rasters (need e-cadastre login)</legend>
    <label class="chk"><input type="checkbox" id="ov-parcels"> <span data-i18n="ovParcels">Parcels</span></label>
    <label class="chk"><input type="checkbox" id="ov-plabels"> <span data-i18n="ovLabels">Parcel labels</span></label>
    <label class="chk"><input type="checkbox" id="ov-buildings"> <span data-i18n="ovBuildings">Buildings</span></label>
    <div style="margin-top:8px">
      <span class="hint" data-i18n="opacity">Parcel fill / overlay opacity</span>
      <input type="range" id="opacity" min="0" max="100" value="25">
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="legMeas">Measurements (plotted parcels)</legend>
    <label class="chk"><input type="checkbox" id="show-area" checked> <span data-i18n="showArea">Show area (m² / ha)</span></label>
    <label class="chk"><input type="checkbox" id="show-len"> <span data-i18n="showLen">Show edge lengths (m)</span></label>
  </fieldset>

  <p class="hint" data-i18n-html="hint"></p>
  </div>
</div>

<script>
// ---- Config -------------------------------------------------------------
const WMS = "https://gp.e-cadastre.am:8443/arpis-geoportal/ows/wms";
const CADASTRE_ATTR = "© State Cadastre Committee of Armenia";

// ---- i18n ---------------------------------------------------------------
const I18N = {
  hy: {
    title:"Հայաստանի կադաստր × OpenStreetMap",
    sub:"Պաշտոնական e-cadastre GeoServer շերտերը OSM-ի վրա։",
    codesPh:`Մեկ ծածկագիր՝ տողում, օր.
01-001-0658-0020
01-001-0658-0017
01-001-0658-0021`,
    plot:"Գծել բոլորը", share:"Կիսվել", clear:"Մաքրել",
    legBasemap:"Հիմնաքարտեզ", legRasters:"Կադաստրի ռաստերներ (պահանջվում է մուտք)", legMeas:"Չափումներ (գծված հողամասեր)",
    ovParcels:"Հողամասեր", ovLabels:"Հողամասերի պիտակներ", ovBuildings:"Շենքեր",
    opacity:"Լցման/շերտի թափանցիկություն",
    showArea:"Ցույց տալ մակերեսը (մ²/հա)", showLen:"Ցույց տալ եզրերի երկարությունը (մ)",
    hint:`Մուտքագրեք կադաստրային ծածկագրերը և սեղմեք <b>Գծել բոլորը</b> — յուրաքանչյուր հողամաս ստանում է իր գույնը՝ մակերեսով և ընտրովի եզրերի երկարություններով։ Սեղմեք հողամասին՝ մանրամասների համար։ Վերևի կադաստրի ռաստերները երևում են միայն <code>e-cadastre.am</code>-ում մուտք գործած վիճակում, ուստի լռելյայն անջատված են։`,
    panelToggle:"Ցույց տալ/թաքցնել վահանակը", locateTitle:"Ցույց տալ իմ տեղը",
    locating:"Որոնում…", locAcc:r=>`Տեղորոշում ±${r} մ`,
    locDenied:"Տեղորոշման թույլտվությունը մերժված է։", locFail:"Չհաջողվեց ստանալ տեղը։",
    geoUnsupported:"Սարքը չի աջակցում տեղորոշում։",
    needHttps:"Տեղորոշումը պահանջում է HTTPS — օգտագործեք github.io հասցեն, ոչ լոկալ ֆայլ։",
    enterCode:"Մուտքագրեք առնվազն մեկ ծածկագիր։",
    plotting:n=>`Գծվում է ${n} ծածկագիր…`, plotted:(a,b)=>`Գծվեց ${a} / ${b}։`,
    corsMsg:"Որոշ հարցումներ արգելափակվեցին CORS-ով — տես console։",
    shareCopied:"Հղումը պատճենվեց ✓", sharePrompt:"Պատճենեք այս հղումը՝",
    rasterWarn:"Կադաստրի ռաստերները պահանջում են ակտիվ մուտք — օգտագործեք ներքևի գունավոր հողամասերը (առանց մուտքի)։",
    notFound:"չի գտնվել", popupArea:"Մակերես", popupPerim:"Պարագիծ", popupVerts:"Գագաթներ", youAreHere:"Դուք այստեղ եք",
  },
  en: {
    title:"Armenia Cadastre × OpenStreetMap",
    sub:"Official e-cadastre GeoServer layers overlaid on OSM.",
    codesPh:`One code per line, e.g.
01-001-0658-0020
01-001-0658-0017
01-001-0658-0021`,
    plot:"Plot all", share:"Share", clear:"Clear",
    legBasemap:"Basemap", legRasters:"Cadastre rasters (need e-cadastre login)", legMeas:"Measurements (plotted parcels)",
    ovParcels:"Parcels", ovLabels:"Parcel labels", ovBuildings:"Buildings",
    opacity:"Parcel fill / overlay opacity",
    showArea:"Show area (m² / ha)", showLen:"Show edge lengths (m)",
    hint:`Enter cadastral codes and <b>Plot all</b> — each parcel gets its own colour, with area and optional edge lengths. Click a parcel for details. The e-cadastre raster layers above only render inside a logged-in <code>e-cadastre.am</code> session (the GeoServer returns “no such layer” to anonymous requests), so they’re off by default.`,
    panelToggle:"Show/hide panel", locateTitle:"Show my location",
    locating:"Locating…", locAcc:r=>`Location ±${r} m`,
    locDenied:"Location permission denied.", locFail:"Couldn't get your location.",
    geoUnsupported:"Geolocation not supported on this device.",
    needHttps:"Location needs HTTPS — use the github.io URL, not a local file.",
    enterCode:"Enter at least one code.",
    plotting:n=>`Plotting ${n} code(s)…`, plotted:(a,b)=>`Plotted ${a} of ${b}.`,
    corsMsg:"Some requests blocked by browser CORS — see console.",
    shareCopied:"Share link copied ✓", sharePrompt:"Copy this share link:",
    rasterWarn:"Cadastre raster overlays need an active e-cadastre login session — use the coloured parcels below (they work without login).",
    notFound:"not found", popupArea:"Area", popupPerim:"Perimeter", popupVerts:"Vertices", youAreHere:"You are here",
  },
  ru: {
    title:"Кадастр Армении × OpenStreetMap",
    sub:"Официальные слои e-cadastre GeoServer поверх OSM.",
    codesPh:`Один код в строке, напр.
01-001-0658-0020
01-001-0658-0017
01-001-0658-0021`,
    plot:"Показать все", share:"Поделиться", clear:"Очистить",
    legBasemap:"Подложка", legRasters:"Растры кадастра (нужен вход)", legMeas:"Измерения (показанные участки)",
    ovParcels:"Участки", ovLabels:"Подписи участков", ovBuildings:"Здания",
    opacity:"Прозрачность заливки/слоя",
    showArea:"Показать площадь (м²/га)", showLen:"Показать длины сторон (м)",
    hint:`Введите кадастровые коды и нажмите <b>Показать все</b> — каждый участок получает свой цвет, с площадью и опциональными длинами сторон. Нажмите на участок для деталей. Растровые слои кадастра выше отображаются только при входе в <code>e-cadastre.am</code>, поэтому по умолчанию отключены.`,
    panelToggle:"Показать/скрыть панель", locateTitle:"Показать моё местоположение",
    locating:"Определение…", locAcc:r=>`Местоположение ±${r} м`,
    locDenied:"Доступ к местоположению запрещён.", locFail:"Не удалось определить местоположение.",
    geoUnsupported:"Геолокация не поддерживается на этом устройстве.",
    needHttps:"Для геолокации нужен HTTPS — используйте адрес github.io, а не локальный файл.",
    enterCode:"Введите хотя бы один код.",
    plotting:n=>`Показываю ${n} код(ов)…`, plotted:(a,b)=>`Показано ${a} из ${b}.`,
    corsMsg:"Некоторые запросы заблокированы CORS — см. консоль.",
    shareCopied:"Ссылка скопирована ✓", sharePrompt:"Скопируйте эту ссылку:",
    rasterWarn:"Растры кадастра требуют активного входа — используйте цветные участки ниже (работают без входа).",
    notFound:"не найдено", popupArea:"Площадь", popupPerim:"Периметр", popupVerts:"Вершины", youAreHere:"Вы здесь",
  },
};
let LANG = "hy";
function t(key, ...a) {
  const d = I18N[LANG] || I18N.hy;
  let v = d[key]; if (v == null) v = I18N.hy[key]; if (v == null) v = key;
  return typeof v === "function" ? v(...a) : v;
}
function applyI18n() {
  document.documentElement.lang = LANG;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.title = t(el.dataset.i18nTitle));
  const lb = document.querySelector(".locate-btn"); if (lb) lb.title = t("locateTitle");
  const ls = document.getElementById("lang"); if (ls) ls.value = LANG;
  if (typeof renderLegend === "function") renderLegend();
}

// ---- Map ----------------------------------------------------------------
const map = L.map("map", { center:[40.2098, 44.4881], zoom:18, zoomControl:true });
map.zoomControl.setPosition("topright");

// Basemaps
const bases = {
  osm: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:20, attribution:"© OpenStreetMap contributors" }),
  carto: L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png", {
    maxZoom:20, attribution:"© OpenStreetMap, © CARTO" }),
  esri: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom:20, attribution:"© Esri, Maxar" }),
  cartoDark: L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png", {
    maxZoom:20, attribution:"© OpenStreetMap, © CARTO" }),
  topo: L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
    maxZoom:17, attribution:"© OpenTopoMap (CC-BY-SA), © OpenStreetMap" }),
  esriTopo: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", {
    maxZoom:19, attribution:"© Esri" }),
  esriStreet: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
    maxZoom:19, attribution:"© Esri" }),
  cyclosm: L.tileLayer("https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png", {
    maxZoom:20, attribution:"© CyclOSM, © OpenStreetMap" }),
  hot: L.tileLayer("https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png", {
    maxZoom:20, attribution:"© OpenStreetMap, HOT" }),
  ortho: L.tileLayer.wms(WMS, {
    layers:"ND_S1-2k_Y2002", format:"image/jpeg", transparent:false,
    version:"1.1.1", maxZoom:22, attribution:CADASTRE_ATTR })
};
let currentBase = bases.osm.addTo(map);

function switchBase(key) {
  if (!bases[key]) return;
  map.removeLayer(currentBase);
  currentBase = bases[key].addTo(map);
  currentBase.bringToBack();
}
document.getElementById("basemap").onchange = (e) => { switchBase(e.target.value); commit(); };

// Cadastre overlays (WMS). Leaflet requests EPSG:3857; GeoServer reprojects from EPSG:2400000.
const startOpacity = 0.7;
const overlays = {
  parcels: L.tileLayer.wms(WMS, { layers:"parcels", format:"image/png", transparent:true,
    version:"1.1.1", opacity:startOpacity, attribution:CADASTRE_ATTR }),
  plabels: L.tileLayer.wms(WMS, { layers:"parcels_label_am", format:"image/png", transparent:true,
    version:"1.1.1", opacity:startOpacity }),
  buildings: L.tileLayer.wms(WMS, { layers:"buildings", format:"image/png", transparent:true,
    version:"1.1.1", opacity:startOpacity })
};
// Rasters start OFF — see note below. Toggle them on only in a logged-in session.

// The e-cadastre GeoServer gates GetMap behind a live login session, so from a
// standalone file the raster overlays usually come back blank. Surface that.
let overlayWarned = false;
Object.values(overlays).forEach(l => l.on("tileerror", () => {
  if (overlayWarned) return;
  overlayWarned = true;
  status(t("rasterWarn"));
}));

const bind = (id, layer) => document.getElementById(id).onchange = (e) => {
  e.target.checked ? layer.addTo(map) : map.removeLayer(layer); commit();
};
bind("ov-parcels", overlays.parcels);
bind("ov-plabels", overlays.plabels);
bind("ov-buildings", overlays.buildings);

const opacityVal = () => document.getElementById("opacity").value / 100;
function applyOpacity() {
  const o = opacityVal();
  Object.values(overlays).forEach(l => l.setOpacity(o));           // rasters (when logged in)
  plotted.forEach(p => p.layer && p.layer.setStyle({ fillOpacity:o })); // colored parcels
  syncURL();
}
document.getElementById("opacity").oninput = applyOpacity;

const status = (m) => document.getElementById("status").textContent = m || "";

// ---- Geometry helpers (geodesic, on WGS84) ------------------------------
const R = 6378137; // metres
const rad = d => d * Math.PI / 180;
function haversine(a, b) {           // a,b = [lat,lng]
  const dLat = rad(b[0]-a[0]), dLng = rad(b[1]-a[1]);
  const s = Math.sin(dLat/2)**2 +
            Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function perimeter(coords) {          // metres
  let p = 0;
  for (let i=0; i<coords.length; i++) p += haversine(coords[i], coords[(i+1)%coords.length]);
  return p;
}
function areaM2(coords) {             // spherical polygon area, metres²
  if (coords.length < 3) return 0;
  let sum = 0;
  for (let i=0; i<coords.length; i++) {
    const [lat1,lng1] = coords[i], [lat2,lng2] = coords[(i+1)%coords.length];
    sum += rad(lng2-lng1) * (2 + Math.sin(rad(lat1)) + Math.sin(rad(lat2)));
  }
  return Math.abs(sum * R * R / 2);
}
const fmtArea = a => a >= 10000 ? `${(a/10000).toFixed(2)} ha (${Math.round(a)} m²)`
                                : `${Math.round(a)} m²`;
const fmtLen  = m => m >= 1000 ? `${(m/1000).toFixed(2)} km` : `${m.toFixed(1)} m`;

// ---- Search & plot multiple cadastral codes -----------------------------
// NOTE: e-cadastre's own code→location endpoint isn't public yet, so this uses
// the open map.astat.am proxy purely as a geocoder. Swap fetchPolygon() out
// once you capture the official search endpoint.
const PALETTE = ["#f59e0b","#38bdf8","#a78bfa","#34d399","#f472b6","#fb7185",
                 "#facc15","#4ade80","#60a5fa","#f97316"];
let plotted = [];                              // {code, coords, layer, ok, color, area, perim}
const areaGroup = L.layerGroup().addTo(map);   // area labels
const lenGroup  = L.layerGroup().addTo(map);   // edge-length labels

async function fetchPolygon(code) {
  const url = "https://map.astat.am/Map/Home/GetCadastralPolygon?cadastralCode=" + encodeURIComponent(code);
  const r = await fetch(url);
  const d = await r.json();
  if (!d.success || !d.coords) return null;
  return d.coords;                             // [[lat,lng],...]
}

function clearAll() {
  plotted.forEach(p => p.layer && map.removeLayer(p.layer));
  plotted = [];
  areaGroup.clearLayers(); lenGroup.clearLayers();
  document.getElementById("legend").innerHTML = "";
  status("");
}

function popupHtml(p) {
  return `<b>${p.code}</b><br>
    ${t("popupArea")}: ${fmtArea(p.area)}<br>
    ${t("popupPerim")}: ${fmtLen(p.perim)}<br>
    ${t("popupVerts")}: ${p.coords.length}`;
}

function renderMeasurements() {
  areaGroup.clearLayers(); lenGroup.clearLayers();
  const showArea = document.getElementById("show-area").checked;
  const showLen  = document.getElementById("show-len").checked;
  plotted.filter(p => p.ok).forEach(p => {
    if (showArea) {
      const c = p.layer.getBounds().getCenter();
      L.marker(c, { interactive:false,
        icon:L.divIcon({ className:"mlabel", html:fmtArea(p.area), iconSize:null }) }).addTo(areaGroup);
    }
    if (showLen) {
      for (let i=0; i<p.coords.length; i++) {
        const a = p.coords[i], b = p.coords[(i+1)%p.coords.length];
        const mid = [(a[0]+b[0])/2, (a[1]+b[1])/2];
        L.marker(mid, { interactive:false,
          icon:L.divIcon({ className:"llabel", html:fmtLen(haversine(a,b)), iconSize:null }) }).addTo(lenGroup);
      }
    }
  });
}

function renderLegend() {
  document.getElementById("legend").innerHTML = plotted.map((p,i) => p.ok
    ? `<div class="legrow"><span class="swatch" data-i="${i}" style="background:${p.color}"></span>
         <span class="code">${p.code}</span><span class="area">${fmtArea(p.area)}</span></div>`
    : `<div class="legrow"><span class="swatch" style="background:#374151"></span>
         <span class="code">${p.code}</span> <span class="miss">${t("notFound")}</span></div>`
  ).join("");
  document.querySelectorAll("#legend .swatch[data-i]").forEach(el => el.onclick = () => {
    const p = plotted[+el.dataset.i];
    if (p && p.layer) { map.fitBounds(p.layer.getBounds(), { maxZoom:19 }); p.layer.openPopup(); }
  });
}

async function plotAll(skipFit = false) {
  const codes = document.getElementById("codes").value
    .split(/[\s,;]+/).map(s => s.trim()).filter(Boolean);
  if (!codes.length) { status(t("enterCode")); return; }
  clearAll();
  status(t("plotting", codes.length));

  const allBounds = [];
  let colorIdx = 0, corsHit = false;
  for (const code of codes) {
    try {
      const coords = await fetchPolygon(code);
      if (!coords) { plotted.push({ code, ok:false }); continue; }
      const color = PALETTE[colorIdx++ % PALETTE.length];
      const layer = L.polygon(coords, { color, weight:2, fillColor:color, fillOpacity:opacityVal() }).addTo(map);
      const p = { code, coords, layer, ok:true, color, area:areaM2(coords), perim:perimeter(coords) };
      layer.bindPopup(popupHtml(p));
      plotted.push(p);
      allBounds.push(layer.getBounds());
    } catch (err) {
      corsHit = true;
      plotted.push({ code, ok:false });
      console.warn("Fetch failed for", code, err);
    }
  }
  renderLegend();
  renderMeasurements();
  if (allBounds.length && !skipFit) {
    let b = allBounds[0];
    allBounds.slice(1).forEach(x => b = b.extend(x));
    map.fitBounds(b, { padding:[30,30], maxZoom:19 });
  }
  const okN = plotted.filter(p => p.ok).length;
  status(corsHit ? t("corsMsg") : t("plotted", okN, codes.length));
  commit();
}

document.getElementById("find").onclick = () => plotAll();
document.getElementById("clear").onclick = clearAll;
document.getElementById("show-area").onchange = () => { renderMeasurements(); commit(); };
document.getElementById("show-len").onchange = () => { renderMeasurements(); commit(); };
document.getElementById("codes").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) plotAll();   // Ctrl/Cmd+Enter
});

// ---- Shareable link (full state encoded in the URL) ---------------------
const OV_MAP = [["ov-parcels","parcels"],["ov-plabels","plabels"],["ov-buildings","buildings"]];

function buildShareURL() {
  const typed = document.getElementById("codes").value.split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean);
  const codes = plotted.length ? plotted.map(p=>p.code) : typed;
  const ov = OV_MAP.filter(([id]) => document.getElementById(id).checked).map(([,k]) => k);
  const c = map.getCenter();
  const p = new URLSearchParams();
  if (codes.length) p.set("codes", codes.join(","));
  p.set("base", document.getElementById("basemap").value);
  p.set("lang", LANG);
  if (ov.length) p.set("ov", ov.join(","));
  p.set("op", document.getElementById("opacity").value);
  p.set("area", document.getElementById("show-area").checked ? 1 : 0);
  p.set("len",  document.getElementById("show-len").checked ? 1 : 0);
  p.set("z", map.getZoom());
  p.set("lat", c.lat.toFixed(6));
  p.set("lng", c.lng.toFixed(6));
  return location.origin + location.pathname + "?" + p.toString();
}

function syncURL() { history.replaceState(null, "", buildShareURL()); }
let isRestoring = false;
function pushURL() { history.pushState(null, "", buildShareURL()); }
function commit() { isRestoring ? syncURL() : pushURL(); }   // history entry unless restoring

document.getElementById("share").onclick = async () => {
  const url = buildShareURL();
  history.replaceState(null, "", url);          // reflect in address bar
  try { await navigator.clipboard.writeText(url); status(t("shareCopied")); }
  catch { window.prompt(t("sharePrompt"), url); }
};

async function applyStateFromURL() {
  const q = new URLSearchParams(location.search);
  if (![...q.keys()].length) return;
  if (q.get("lang")) { LANG = q.get("lang"); applyI18n(); }

  const base = q.get("base");
  if (base) { document.getElementById("basemap").value = base; switchBase(base); }

  const ov = (q.get("ov") || "").split(",").filter(Boolean);
  OV_MAP.forEach(([id,k]) => {
    const on = ov.includes(k);
    document.getElementById(id).checked = on;
    on ? overlays[k].addTo(map) : map.removeLayer(overlays[k]);
  });

  if (q.get("op")  !== null) { document.getElementById("opacity").value = q.get("op"); applyOpacity(); }
  if (q.get("area") !== null) document.getElementById("show-area").checked = q.get("area") === "1";
  if (q.get("len")  !== null) document.getElementById("show-len").checked  = q.get("len")  === "1";

  const hasView = q.get("lat") && q.get("lng") && q.get("z");
  if (q.get("codes")) {
    document.getElementById("codes").value = q.get("codes").split(",").join("\n");
    await plotAll(!!hasView);                    // don't auto-fit if a view is shared
  }
  if (hasView) map.setView([+q.get("lat"), +q.get("lng")], +q.get("z"));
}
async function restore() { isRestoring = true; try { await applyStateFromURL(); } finally { isRestoring = false; } }
try { LANG = new URLSearchParams(location.search).get("lang") || localStorage.getItem("lang") || "hy"; } catch { LANG = "hy"; }
applyI18n();
document.getElementById("lang").onchange = (e) => {
  LANG = e.target.value; try { localStorage.setItem("lang", LANG); } catch {} applyI18n(); commit();
};
restore();
map.on("moveend", syncURL);
window.addEventListener("popstate", restore);

// ---- Show my position (mobile-friendly geolocation) ---------------------
let meMarker = null, meCircle = null, watching = false, firstFix = false;

// Locate button = a third button joined under the zoom +/- bar (native look)
const locBtn = L.DomUtil.create("a", "locate-btn", map.zoomControl.getContainer());
locBtn.href = "#"; locBtn.title = t("locateTitle"); locBtn.innerHTML = "◎";
locBtn.setAttribute("role", "button");
L.DomEvent.on(locBtn, "click", (e) => { L.DomEvent.stop(e); toggleLocate(locBtn); });

// Collapsible panel (esp. for mobile)
const panelEl = document.getElementById("panel");
document.getElementById("panelToggle").onclick = () => panelEl.classList.toggle("collapsed");
if (window.matchMedia("(max-width: 640px)").matches) panelEl.classList.add("collapsed");

function toggleLocate(btn) {
  if (!("geolocation" in navigator)) { status(t("geoUnsupported")); return; }
  if (!window.isSecureContext) { status(t("needHttps")); return; }
  if (watching) {
    map.stopLocate(); watching = false;
    if (btn) btn.classList.remove("active");
    status("");
    return;
  }
  watching = true;
  if (btn) btn.classList.add("active");
  status(t("locating"));
  firstFix = true;
  map.locate({ watch:true, enableHighAccuracy:true });
}

map.on("locationfound", (e) => {
  const r = e.accuracy || 0;
  if (!meMarker) {
    meMarker = L.circleMarker(e.latlng, { radius:6, color:"#fff", weight:2,
      fillColor:"#2563eb", fillOpacity:1 }).addTo(map).bindPopup(t("youAreHere"));
    meCircle = L.circle(e.latlng, { radius:r, color:"#2563eb", weight:1, fillOpacity:0.08 }).addTo(map);
  } else {
    meMarker.setLatLng(e.latlng);
    meCircle.setLatLng(e.latlng).setRadius(r);
  }
  if (firstFix) { map.setView(e.latlng, 18); firstFix = false; }
  status(t("locAcc", Math.round(r)));
});

map.on("locationerror", (e) => {
  watching = false;
  const lb = document.querySelector(".locate-btn"); if (lb) lb.classList.remove("active");
  status(e.code === 1 ? t("locDenied") : t("locFail"));
});
</script>
</body>
